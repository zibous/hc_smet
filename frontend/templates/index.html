<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMeters Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E⚡%3C/text%3E%3C/svg%3E">

  <!-- Chart.js  und style.css -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
  <link rel="stylesheet" href="static/css/live.css">
</head>

<body>

  <header class="header">
    <div class="header-layout-wrap">
      <div>
        <div class="title">SmartMeters Dashboard</div>
        <div class="subtitle">Pokey Smartmeters</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="live" class="nav-link">📡 Live</a>
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Theme umschalten">
          <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
        </button>
        <button class="theme-toggle-btn" onclick="document.getElementById('bgPick').click()" title="Hintergrundfarbe">🎨</button>
        <input type="color" id="bgPick" style="display:none" oninput="applyBg(this.value)" onchange="applyBg(this.value)">
        <button class="theme-toggle-btn" id="bgReset" onclick="resetBg()" style="display:none;font-size:.7rem" title="Farbe zurücksetzen">✕</button>
      </div>
    </div>

    <div class="top-bar">
      <div id="breadcrumb" class="breadcrumb">Haus</div>
      <div class="controls"></div>
    </div>
  </header>

  <main class="container">

    <section class="chart-card" id="dashboardCard">

      <div class="chart-wrap">
        <canvas id="energyChart"></canvas>
      </div>

      <div id="summary"></div>

    </section>

    <section id="cards" class="cards"></section>

  </main>

  <!-- ✨ NEU: Der moderne VisionOS Glas-Footer ganz unten -->
  <footer class="footer">
    <div class="footer-wrap">
      <div>&copy; 2013–<span id="currentYear"></span> Peter Siebler. Alle Rechte vorbehalten.</div>
      <div style="opacity: 0.8;">Application: hc_smet_analytics &bull; v2.2.0</div>
    </div>
  </footer>

  <!-- Script zur Steuerung des Day/Night Modes (Greift vor dem Rendering) -->
  <script>
    // Automatisches Copyright-Jahr setzen
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    /* Background Color Picker */
    function applyBg(c) {
      document.documentElement.style.setProperty('--bg', c);
      document.body.style.setProperty('background', c);
      // Surface-Farben: leicht aufgehellt
      var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
      var s1 = '#' + [r, g, b].map(function (v) { return Math.min(255, v + 15).toString(16).padStart(2, '0') }).join('');
      var s2 = '#' + [r, g, b].map(function (v) { return Math.min(255, v + 25).toString(16).padStart(2, '0') }).join('');
      document.documentElement.style.setProperty('--surface', s1);
      document.documentElement.style.setProperty('--surface2', s2);
      localStorage.setItem('smet-bg', c);
      document.getElementById('bgReset').style.display = '';
    }
    
    function resetBg() {
      document.documentElement.style.removeProperty('--bg');
      document.documentElement.style.removeProperty('--surface');
      document.documentElement.style.removeProperty('--surface2');
      document.body.style.removeProperty('background');
      localStorage.removeItem('smet-bg');
      document.getElementById('bgReset').style.display = 'none';
    }
    
    // Gespeicherte Farbe beim Laden anwenden
    (function () { 
      var c = localStorage.getItem('smet-bg'); 
      if (c) { 
        applyBg(c); 
        document.addEventListener('DOMContentLoaded', function () { 
          document.getElementById('bgReset').style.display = ''; 
        }); 
      } 
    })();

    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const text = document.getElementById('themeText');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);

      if (theme === 'dark') {
        if (icon) icon.textContent = '🌙';
        if (text) text.textContent = 'Night Mode';
      } else {
        if (icon) icon.textContent = '☀️';
        if (text) text.textContent = 'Light Mode';
      }

      // Custom Event feuern, damit Chart.js in main.js die Farben anpassen kann
      window.dispatchEvent(new CustomEvent('themeChanged', { detail: theme }));
    }

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
      setTheme(savedTheme);
    } else if (systemPrefersDark) {
      setTheme('dark');
    } else {
      setTheme('light');
    }

    btn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    });
  </script>

  <script type="module" src="static/js/main.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMeters Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E⚡%3C/text%3E%3C/svg%3E">

  <!-- Chart.js  und style.css -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/style.bundle.css">
</head>

<body>

    <header class="header" style="position: relative; padding-right: 20px;">
    <div class="header-layout-wrap" style="display:flex; justify-content:space-between; align-items:center; width:100%;">
      <div>
        <!-- 🌟 HIER NEU: Titel farblich passend zu Smart-Tech (Neon-Grün & Cyan) -->
        <div class="title" style="font-size: 3.5rem; font-weight: bold;"><span style="color: #22c55e;">Smart</span><span style="color: #06b6d4;">Meters</span> Dashboard</div>
        <div class="subtitle">Pokey Smartmeters</div>
      </div>
      <!-- Nur noch der Live-Link bleibt hier, z-index schützt vor Überlagerung -->
      <div style="display:flex; align-items:center; gap:8px; position: relative; z-index: 2;">
        <a href="live" class="nav-link">📡 Live</a>
      </div>
    </div>

    <!-- 🌟 HIER NEU: Das SmartMeter-Hintergrundbild (Digitale Anzeige + Funkwellen + Chip) -->
    <div class="header-bg-wrapper" style="position: absolute; right: 80px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 1;">
      <svg style="width: auto; height: 70px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55;" viewBox="0 0 800 200">
        <!-- 📡 Funk-Übertragungswellen links (Cyber-Cyan) -->
        <path d="M 130 70 A 40 40 0 0 1 130 130 M 115 55 A 60 60 0 0 1 115 145 M 100 40 A 80 80 0 0 1 100 160" stroke="#06b6d4" stroke-width="4" />
        <circle cx="145" cy="100" r="6" fill="#06b6d4" stroke="none" />

        <!-- ⚡ Verbindungslinie & Puls (In der Textfarbe des Dashboards) -->
        <path d="M 50 100 L 90 100 M 160 100 L 290 100 L 305 100 L 315 45 L 330 155 L 345 25 L 360 135 L 370 100 L 410 100" stroke="currentColor" stroke-width="5" />
        <path d="M 410 100 L 460 100 L 470 65 L 485 145 L 500 35 L 515 125 L 525 100 L 590 100" stroke="currentColor" stroke-width="5" />

        <!-- 📟 Digitaler Zähler / Microchip rechts (Smart-Grün) -->
        <rect x="610" y="50" width="100" height="90" rx="10" stroke="#22c55e" stroke-width="4" fill="#22c55e" fill-opacity="0.1" />
        <!-- Digitales Display im Zähler -->
        <rect x="622" y="65" width="76" height="32" rx="4" stroke="#22c55e" stroke-width="2" />
        <line x1="632" y1="81" x2="688" y2="81" stroke="#22c55e" stroke-width="3" stroke-dasharray="8 4" />
        <!-- Anschlüsse/Leiterbahnen unten -->
        <line x1="630" y1="140" x2="630" y2="155" stroke="#22c55e" stroke-width="3" />
        <line x1="660" y1="140" x2="660" y2="160" stroke="#22c55e" stroke-width="3" />
        <line x1="690" y1="140" x2="690" y2="155" stroke="#22c55e" stroke-width="3" />

        <path d="M 710 100 L 760 100" stroke="currentColor" stroke-width="5" />
      </svg>
    </div>
  </header>

  <main class="container">

    <div class="top-bar">
      <div id="breadcrumb" class="breadcrumb">Haus</div>
      <div class="controls"></div>
    </div>

    <section class="chart-card" id="dashboardCard">

      <div class="chart-wrap">
        <canvas id="energyChart"></canvas>
      </div>

      <div id="summary"></div>

    </section>

    <section id="cards" class="cards"></section>

  </main>

  <!-- 🌟 EINHEITLICHER FOOTER: Füge diesen ganz unten im HTML hinzu -->
  <footer class="footer">
      SmartMeters Dashboard · Echtzeit-Überwachung
      <span style="margin: 0 8px; color: var(--border);">|</span>
      <span id="themeToggleFooter" style="cursor:pointer; font-weight:500; text-decoration:underline;">🌓 Design wechseln</span>
  </footer>


  <script src="static/js/theme-init.js"></script>
  <script type="module" src="static/js/app.bundle.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMeters Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E⚡%3C/text%3E%3C/svg%3E">

  <!-- Chart.js  und style.css -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/style.bundle.css">
</head>

<body>

  <header class="header">
    <div class="header-layout-wrap">
      <div>
        <div class="title">SmartMeters Dashboard</div>
        <div class="subtitle">Pokey Smartmeters</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="live" class="nav-link">📡 Live</a>
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Theme umschalten">
          <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
        </button>
        <button class="theme-toggle-btn" onclick="document.getElementById('bgPick').click()" title="Hintergrundfarbe">🎨</button>
        <input type="color" id="bgPick" style="display:none" oninput="applyBg(this.value)" onchange="applyBg(this.value)">
        <button class="theme-toggle-btn" id="bgReset" onclick="resetBg()" style="display:none;font-size:.7rem" title="Farbe zurücksetzen">✕</button>
      </div>
    </div>

    <div class="top-bar">
      <div id="breadcrumb" class="breadcrumb">Haus</div>
      <div class="controls"></div>
    </div>
  </header>

  <main class="container">

    <section class="chart-card" id="dashboardCard">

      <div class="chart-wrap">
        <canvas id="energyChart"></canvas>
      </div>

      <div id="summary"></div>

    </section>

    <section id="cards" class="cards"></section>

  </main>

  <!-- ✨ NEU: Der moderne VisionOS Glas-Footer ganz unten -->
  <footer class="footer">
    <div class="footer-wrap">
      <div>&copy; 2013–<span id="currentYear"></span> Peter Siebler. Alle Rechte vorbehalten.</div>
      <div style="opacity: 0.8;">Application: hc_smet_analytics &bull; v2.2.0</div>
    </div>
  </footer>

  <!-- Script zur Steuerung des Day/Night Modes (Greift vor dem Rendering) -->
  <script src="static/js/theme-init.js"></script>
  <script type="module" src="static/js/app.bundle.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMeters Live</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E📡%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/style.bundle.css">
</head>

<body>

  <header class="header" style="position: relative; padding-right: 20px;">
    <div class="header-layout-wrap"
      style="display:flex; justify-content:space-between; align-items:center; width:100%;">
      <div>
        <div class="title" style="font-size: 3.5rem; font-weight: bold;"><span
            style="color: #ef4444;">Smart</span>Meters <span style="color: #06b6d4;">Live</span></div>
        <div class="subtitle">Echtzeit-Sensordaten &bull; Stundenwerte &bull; Analytics</div>
      </div>

      <!-- Rechts: SVG + Button in Row 1, Badge in Row 2 -->
      <div
        style="display:grid; grid-template-columns: auto auto; grid-template-rows: 70px auto; align-items:center; gap:0 16px; position:relative; z-index:2;">

        <!-- Row 1, Col 1: SVG -->
        <svg
          style="width:auto; height:70px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; opacity:0.55; grid-column:1; grid-row:1;"
          viewBox="0 0 800 200">
          <path d="M 135 140 L 145 60 L 155 140 M 130 110 L 160 110" stroke="#ef4444" stroke-width="3" />
          <circle cx="145" cy="55" r="5" fill="#ef4444" stroke="none" />
          <path d="M 165 40 A 25 25 0 0 1 165 70 M 175 30 A 45 45 0 0 1 175 80" stroke="#ef4444" stroke-width="3" />
          <path
            d="M 50 100 L 100 100 M 190 100 L 290 100 L 300 100 L 310 30 L 320 170 L 330 40 L 340 150 L 350 80 L 360 120 L 370 100 L 410 100"
            stroke="currentColor" stroke-width="5" />
          <path d="M 410 100 L 460 100 L 470 40 L 480 160 L 490 50 L 500 140 L 510 80 L 520 110 L 530 100 L 590 100"
            stroke="currentColor" stroke-width="5" />
          <circle cx="650" cy="100" r="45" stroke="#06b6d4" stroke-width="4" stroke-dasharray="12 8" fill="#06b6d4"
            fill-opacity="0.05" />
          <circle cx="650" cy="100" r="25" stroke="#06b6d4" stroke-width="3" />
          <circle cx="650" cy="100" r="5" fill="#06b6d4" stroke="none" />
          <line x1="650" y1="100" x2="682" y2="68" stroke="#06b6d4" stroke-width="3" />
          <path d="M 710 100 L 760 100" stroke="currentColor" stroke-width="5" />
        </svg>

        <!-- Row 1, Col 2: Button -->
        <a href="./" class="nav-link" style="grid-column:2; grid-row:1; align-self:center;">📊 Dashboard</a>

        <!-- Row 2, Col 1: Badge zentriert unter SVG -->
        <span id="header-update" class="header-update-pill"
          style="grid-column:1; grid-row:2; justify-self:center; margin-top:4px;"></span>

      </div>
    </div>
  </header>


  <main class="container">

    <div class="top-bar">
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="sensors">📡 Live Sensoren</button>
        <button class="tab-btn" data-tab="hourly">⏱️ Stundenwerte 24h</button>
        <button class="tab-btn" data-tab="analytics">🔬 Analytics</button>
      </nav>
    </div>

    <!-- Tab: Live Sensoren -->
    <section id="tab-sensors" class="tab-content active">
      <div class="section-header">
        <h2>Aktuelle Sensorwerte</h2>
        <span class="refresh-info" id="sensors-refresh">—</span>
      </div>
      <div id="sensors-grid" class="sensor-grid"></div>
    </section>

    <!-- Tab: Stundenwerte -->
    <section id="tab-hourly" class="tab-content">
      <div class="section-header">
        <h2>Stundenwerte (letzte 24h)</h2>
        <span class="refresh-info" id="hourly-refresh">—</span>
      </div>
      <div class="chart-card">
        <canvas id="hourlyChart"></canvas>
      </div>
      <div id="hourly-table-wrap"></div>
    </section>

    <!-- Tab: Analytics -->
    <section id="tab-analytics" class="tab-content">
      <div class="section-header">
        <h2>Sensor-Profile (Clustering)</h2>
        <span class="refresh-info" id="analytics-refresh">—</span>
      </div>
      <div id="analytics-grid" class="sensor-grid"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-wrap" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div>&copy; 2013–<span id="currentYear"></span> Peter Siebler.</div>
      <div style="opacity: 0.8; display: flex; gap: 8px; align-items: center; user-select: none;">
        <span>Live Dashboard &bull; v1.0.0</span>
        <span style="color: var(--border);">&bull;</span>
        <!-- 🌟 HIER NEU: Der Design-Wechsler sauber eingereiht -->
        <span id="themeToggleFooter" style="cursor: pointer; text-decoration: underline; font-weight: 500;">🌓 Design
          wechseln</span>
      </div>
    </div>
  </footer>

  <!-- Theme Toggle & Background Color -->
  <script>
    // Setzt das aktuelle Jahr im Footer, sobald das DOM bereit ist
    document.addEventListener('DOMContentLoaded', function () {
      const cy = document.getElementById('currentYear');
      if (cy) cy.textContent = new Date().getFullYear();

      // Text im Footer beim ersten Laden passend einstellen
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const footerBtn = document.getElementById('themeToggleFooter');
      if (footerBtn) {
        footerBtn.innerHTML = currentTheme === 'dark' ? '☀️ Helles Design' : '🌙 Dunkles Design';
      }
    });

    // Zentrale Theme-Steuerung (Bleibt inline für flackerfreien Start)
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);

      // Synchronisation für alle Dashboards im Projekt (health-theme)
      localStorage.setItem('health-theme', theme);

      // Text im Footer aktualisieren, falls er im DOM bereits existiert
      const footerBtn = document.getElementById('themeToggleFooter');
      if (footerBtn) {
        footerBtn.innerHTML = theme === 'dark' ? '☀️ Helles Design' : '🌙 Dunkles Design';
      }
    }

    // Theme beim Start sofort ermitteln und setzen
    const savedTheme = localStorage.getItem('theme') || localStorage.getItem('health-theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

    // 🌟 GLOBALER KLICK-ABFÄNGER: Reagiert auf den neuen Footer-Link, sobald er geladen ist
    document.addEventListener('click', function (event) {
      if (event.target && event.target.id === 'themeToggleFooter') {
        const cur = document.documentElement.getAttribute('data-theme');
        setTheme(cur === 'dark' ? 'light' : 'dark');
      }
    });
  </script>

  <script type="module" src="static/js/live/main.js"></script>

</body>

</html>

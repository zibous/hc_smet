<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMeters Live</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E📡%3C/text%3E%3C/svg%3E">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/style.bundle.css">
</head>

<body>

  <header class="header">
    <div class="header-layout-wrap">
      <div>
        <div class="title">SmartMeters Live</div>
        <div class="subtitle">Echtzeit-Sensordaten &bull; Stundenwerte &bull; Analytics</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="./" class="nav-link">📊 Dashboard</a>
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Theme umschalten">
          <span id="themeIcon">☀️</span> <span id="themeText">Light Mode</span>
        </button>
        <button class="theme-toggle-btn" onclick="document.getElementById('bgPick').click()" title="Hintergrundfarbe">🎨</button>
        <input type="color" id="bgPick" style="display:none" oninput="applyBg(this.value)" onchange="applyBg(this.value)">
        <button class="theme-toggle-btn" id="bgReset" onclick="resetBg()" style="display:none;font-size:.7rem" title="Farbe zurücksetzen">✕</button>
      </div>
    </div>

    <div class="top-bar">
      <nav class="tab-nav" id="tabNav">
        <button class="tab-btn active" data-tab="sensors">📡 Live Sensoren</button>
        <button class="tab-btn" data-tab="hourly">⏱️ Stundenwerte 24h</button>
        <button class="tab-btn" data-tab="analytics">🔬 Analytics</button>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- Tab: Live Sensoren -->
    <section id="tab-sensors" class="tab-content active">
      <div class="section-header">
        <h2>Aktuelle Sensorwerte</h2>
        <span class="refresh-info" id="sensors-refresh">—</span>
      </div>
      <div id="sensors-grid" class="sensor-grid"></div>
    </section>

    <!-- Tab: Stundenwerte -->
    <section id="tab-hourly" class="tab-content">
      <div class="section-header">
        <h2>Stundenwerte (letzte 24h)</h2>
        <span class="refresh-info" id="hourly-refresh">—</span>
      </div>
      <div class="chart-card">
        <canvas id="hourlyChart"></canvas>
      </div>
      <div id="hourly-table-wrap"></div>
    </section>

    <!-- Tab: Analytics -->
    <section id="tab-analytics" class="tab-content">
      <div class="section-header">
        <h2>Sensor-Profile (Clustering)</h2>
        <span class="refresh-info" id="analytics-refresh">—</span>
      </div>
      <div id="analytics-grid" class="sensor-grid"></div>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-wrap">
      <div>&copy; 2013–<span id="currentYear"></span> Peter Siebler.</div>
      <div style="opacity: 0.8;">Live Dashboard &bull; v1.0.0</div>
    </div>
  </footer>

  <!-- Theme Toggle & Background Color -->
  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();

    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const text = document.getElementById('themeText');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (theme === 'dark') {
        if (icon) icon.textContent = '🌙';
        if (text) text.textContent = 'Night Mode';
      } else {
        if (icon) icon.textContent = '☀️';
        if (text) text.textContent = 'Light Mode';
      }
    }

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

    btn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'dark' ? 'light' : 'dark');
    });

    // Background Color Functions
    function applyBg(c) {
      document.documentElement.style.setProperty('--bg', c);
      document.body.style.setProperty('background', c);
      var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
      var s1 = '#' + [r, g, b].map(function (v) { return Math.min(255, v + 15).toString(16).padStart(2, '0') }).join('');
      var s2 = '#' + [r, g, b].map(function (v) { return Math.min(255, v + 25).toString(16).padStart(2, '0') }).join('');
      document.documentElement.style.setProperty('--surface', s1);
      document.documentElement.style.setProperty('--surface2', s2);
      localStorage.setItem('smet-bg', c);
      document.getElementById('bgReset').style.display = '';
    }

    function resetBg() {
      document.documentElement.style.removeProperty('--bg');
      document.documentElement.style.removeProperty('--surface');
      document.documentElement.style.removeProperty('--surface2');
      document.body.style.removeProperty('background');
      localStorage.removeItem('smet-bg');
      document.getElementById('bgReset').style.display = 'none';
      document.getElementById('bgPick').value = '#000000';
    }

    // Load saved background
    var savedBg = localStorage.getItem('smet-bg');
    if (savedBg) {
      document.getElementById('bgPick').value = savedBg;
      applyBg(savedBg);
    }
  </script>

  <script type="module" src="static/js/live/main.js"></script>

</body>

</html>

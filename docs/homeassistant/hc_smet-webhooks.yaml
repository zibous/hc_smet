webhooks_hc_smet_pack:
  # ═══════════════════════════════════════════════════════════════════════
  # Home Assistant Webhook-Vorlage für hc_smet (SmartMeter PoKeys Service)
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Konfiguration in .env:
  #   HA_WEBHOOK_URL=http://192.168.1.xxx:8123
  #   HA_WEBHOOK_ID=smartmeters
  #
  # Verfügbare Events & Payload-Felder:
  # ┌──────────────────────┬──────────────────────────────────────────────────────────────┐
  # │ Event                │ Felder                                                       │
  # ├──────────────────────┼──────────────────────────────────────────────────────────────┤
  # │ app_start            │ version, mode (GET/POST)                                     │
  # │ app_stop             │ mode                                                         │
  # │ health_update        │ status, uptime, database{}, hardware{}, logs{}               │
  # │ device_offline       │ device_id (IF64/IF65), ip, message                           │
  # │ device_online        │ device_id (IF64/IF65), ip                                    │
  # └──────────────────────┴──────────────────────────────────────────────────────────────┘
  #
  # Alle Payloads enthalten: event, application ("pokeys-service"), timestamp
  #
  # health_update wird periodisch gesendet (alle MQTT_INTERVAL Sekunden)
  # und enthält:
  #   - status: "healthy" / "unhealthy"
  #   - uptime: "2d 5h 30m"
  #   - database: { connected, file, error }
  #   - hardware: { cpu_usage_pct, ram_usage_pct, disk_free_gb, disk_used_pct }
  #   - logs: { recent_errors_count, log_file_path }
  #
  # Beispiel-Payload (device_offline):
  # {
  #   "event": "device_offline",
  #   "application": "pokeys-service",
  #   "timestamp": "2026-07-03T14:32:01+00:00",
  #   "device_id": "IF64",
  #   "ip": "10.1.1.64",
  #   "message": "Connect Timeout"
  # }
  #
  # Beispiel-Payload (health_update):
  # {
  #   "event": "health_update",
  #   "application": "pokeys-service",
  #   "timestamp": "2026-07-03T14:32:01+00:00",
  #   "status": "healthy",
  #   "uptime": "5h 30m 12s",
  #   "database": { "connected": true, "file": "sensors_2026.db" },
  #   "hardware": { "cpu_usage_pct": 12.3, "ram_usage_pct": 45.2,
  #                 "disk_free_gb": 28.5, "disk_used_pct": 62.1 },
  #   "logs": { "recent_errors_count": 0 }
  # }
  # ═══════════════════════════════════════════════════════════════════════


  # ─────────────────────────────────────────────────────────────────────
  # AUTOMATIONS (→ automations.yaml)
  # ─────────────────────────────────────────────────────────────────────

  automation:

    - alias: "SmartMeters Webhook Empfänger"
      id: smartmeters_webhook
      mode: queued
      max: 10

      trigger:
        - platform: webhook
          webhook_id: smartmeters
          allowed_methods:
            - POST
          local_only: true

      action:
        - choose:

            # ── App gestartet ──
            - conditions:
                - condition: template
                  value_template: "{{ trigger.json.event == 'app_start' }}"
              sequence:
                - service: logbook.log
                  data:
                    name: SmartMeters
                    message: >-
                      🟢 v{{ trigger.json.version | default('?') }} gestartet
                      (Modus: {{ trigger.json.mode | default('?') }})

            # ── App gestoppt ──
            - conditions:
                - condition: template
                  value_template: "{{ trigger.json.event == 'app_stop' }}"
              sequence:
                - service: logbook.log
                  data:
                    name: SmartMeters
                    message: "🔴 Service gestoppt"

            # ── PoKeys-Gerät offline ──
            - conditions:
                - condition: template
                  value_template: "{{ trigger.json.event == 'device_offline' }}"
              sequence:
                - service: persistent_notification.create
                  data:
                    title: "🔌 PoKeys {{ trigger.json.device_id | default('?') }} offline"
                    message: >-
                      {{ trigger.json.device_id }} ({{ trigger.json.ip | default('?') }})
                      nicht erreichbar: {{ trigger.json.message | default('') }}
                    notification_id: "smet_device_{{ trigger.json.device_id | default('unknown') }}"
                - service: notify.notify
                  data:
                    title: "🔌 SmartMeter offline"
                    message: >-
                      {{ trigger.json.device_id }} ({{ trigger.json.ip | default('?') }})
                      nicht erreichbar

            # ── PoKeys-Gerät wieder online ──
            - conditions:
                - condition: template
                  value_template: "{{ trigger.json.event == 'device_online' }}"
              sequence:
                - service: persistent_notification.dismiss
                  data:
                    notification_id: "smet_device_{{ trigger.json.device_id | default('unknown') }}"
                - service: logbook.log
                  data:
                    name: SmartMeters
                    message: >-
                      ✅ {{ trigger.json.device_id | default('?') }}
                      ({{ trigger.json.ip | default('?') }}) wieder online

            # ── Periodischer Health-Check ──
            - conditions:
                - condition: template
                  value_template: "{{ trigger.json.event == 'health_update' }}"
              sequence:
                # Nur bei Problemen benachrichtigen
                - condition: template
                  value_template: "{{ trigger.json.status == 'unhealthy' }}"
                - service: persistent_notification.create
                  data:
                    title: "⚠️ SmartMeters – System unhealthy"
                    message: >-
                      Status: {{ trigger.json.status }}
                      DB: {{ trigger.json.database.connected if trigger.json.database is defined else '?' }}
                      Disk: {{ trigger.json.hardware.disk_used_pct if trigger.json.hardware is defined else '?' }}%
                      Errors: {{ trigger.json.logs.recent_errors_count if trigger.json.logs is defined else '?' }}
                    notification_id: smet_unhealthy

          default:
            - service: logbook.log
              data:
                name: SmartMeters
                message: >-
                  Unbekanntes Event: {{ trigger.json.event if trigger.json is defined else 'kein JSON' }}


  # ─────────────────────────────────────────────────────────────────────
  # TEMPLATE SENSOREN (→ configuration.yaml)
  # ─────────────────────────────────────────────────────────────────────

  template:
    - trigger:
        - platform: webhook
          webhook_id: smartmeters
          allowed_methods:
            - POST
          local_only: true
      sensor:
        - name: "SmartMeters Status"
          unique_id: smet_webhook_status
          state: >-
            {% if trigger.json.event == 'health_update' %}
              {{ trigger.json.status | default('unknown') }}
            {% else %}
              {{ trigger.json.event }}
            {% endif %}
          icon: "mdi:flash"
          attributes:
            event: "{{ trigger.json.event }}"
            uptime: "{{ trigger.json.uptime | default('') }}"
            last_update: "{{ trigger.json.timestamp }}"

        - name: "SmartMeters CPU"
          unique_id: smet_webhook_cpu
          state: "{{ trigger.json.hardware.cpu_usage_pct | default(0) }}"
          unit_of_measurement: "%"
          icon: "mdi:cpu-64-bit"
          availability: "{{ trigger.json.event == 'health_update' and trigger.json.hardware is defined }}"

        - name: "SmartMeters RAM"
          unique_id: smet_webhook_ram
          state: "{{ trigger.json.hardware.ram_usage_pct | default(0) }}"
          unit_of_measurement: "%"
          icon: "mdi:memory"
          availability: "{{ trigger.json.event == 'health_update' and trigger.json.hardware is defined }}"

        - name: "SmartMeters Disk frei"
          unique_id: smet_webhook_disk_free
          state: "{{ trigger.json.hardware.disk_free_gb | default(0) }}"
          unit_of_measurement: "GB"
          device_class: data_size
          icon: "mdi:harddisk"
          availability: "{{ trigger.json.event == 'health_update' and trigger.json.hardware is defined }}"

        - name: "SmartMeters Log-Fehler"
          unique_id: smet_webhook_errors
          state: "{{ trigger.json.logs.recent_errors_count | default(0) }}"
          icon: "mdi:alert-circle"
          availability: "{{ trigger.json.event == 'health_update' and trigger.json.logs is defined }}"

      binary_sensor:
        - name: "SmartMeters DB verbunden"
          unique_id: smet_webhook_db_connected
          state: "{{ trigger.json.database.connected | default(false) }}"
          device_class: connectivity
          icon: "mdi:database"
          availability: "{{ trigger.json.event == 'health_update' and trigger.json.database is defined }}"

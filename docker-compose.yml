services:
  hc_smet:
    build: .
    container_name: hc_smet
    restart: unless-stopped

    ports:
      - "8096:5045"

    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./logs:/app/logs

    env_file:
      - ./.env

    environment:
      - TZ=Europe/Vaduz

    healthcheck:
      test: "curl -sf http://localhost:5045/api/status || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

